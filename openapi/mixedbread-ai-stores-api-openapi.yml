          title: Return Metadata
          description: Whether to return file metadata
          default: true
      type: object
      required:
      - store_identifiers
      - pattern
      title: StoreChunkGrepParams
      description: 'Parameters for matching store chunks against a regular expression.


        Unlike semantic search, grep performs exact text matching — no embeddings, no

        reranking. It finds chunks whose literal text contains the pattern.'

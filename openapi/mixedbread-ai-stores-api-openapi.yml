components:
  schemas:
    FileSearchResultRule:
      properties:
        query:
          type: string
          title: Query
          description: The query to trigger the rule
        store_id:
          type: string
          title: Store Id
          description: The store identifier to apply the rule to
        type:
          type: string
          const: file_search_result
          title: Type
          description: The type of substitution
        file_id:
          type: string
          title: File Id
          description: The file ID of the file to substitute
        chunk_index:
          type: integer
          minimum: 0.0
          title: Chunk Index
          description: An optional chunk index to use for the chunk substitution
          default: 0
        result_index:
          type: integer
          minimum: 0.0
          title: Result Index
          description: The index where the result will be inserted
      type: object
      required:
      - query
      - store_id
      - type
      - file_id
      - result_index
      title: FileSearchResultRule
      description: Represents a file search result rule for a vector store search.
    ContextualizationConfig:
      properties:
        with_metadata:
          anyOf:
          - type: boolean
          - items:
              type: string
            type: array
          title: With Metadata
          description: Include all metadata or specific fields in the contextualization. Supports dot notation for nested fields (e.g., 'author.name'). When True, all metadata is included (flattened). When a list, only specified fields are included.
          default: false
          examples:
          - true
          - false
          - - title
            - author.name
            - author.email
            - tags
        with_file_context:
          type: boolean
          title: With File Context
          description: Use an LLM to generate a short context for each text chunk that situates it within the full document, improving retrieval accuracy. Only applies to text content during non-sliced ingestion.
          default: false
      type: object
      title: ContextualizationConfig
    ImageUrlInputChunk:
      properties:
        chunk_index:
          type: integer
          title: Chunk Index
          description: position of the chunk in a file
          examples:
          - 0
          - 1
          - 2
          - 3
          - 4
        mime_type:
          type: string
          title: Mime Type
          description: mime type of the chunk
          default: image/jpeg
          examples:
          - image/jpeg
        generated_metadata:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/MarkdownChunkGeneratedMetadata'
            - $ref: '#/components/schemas/TextChunkGeneratedMetadata'
            - $ref: '#/components/schemas/PDFChunkGeneratedMetadata'
            - $ref: '#/components/schemas/CodeChunkGeneratedMetadata'
            - $ref: '#/components/schemas/AudioChunkGeneratedMetadata'
            - $ref: '#/components/schemas/VideoChunkGeneratedMetadata'
            - $ref: '#/components/schemas/ImageChunkGeneratedMetadata'
            discriminator:
              propertyName: type
              mapping:
                audio: '#/components/schemas/AudioChunkGeneratedMetadata'
                code: '#/components/schemas/CodeChunkGeneratedMetadata'
                image: '#/components/schemas/ImageChunkGeneratedMetadata'
                markdown: '#/components/schemas/MarkdownChunkGeneratedMetadata'
                pdf: '#/components/schemas/PDFChunkGeneratedMetadata'
                text: '#/components/schemas/TextChunkGeneratedMetadata'
                video: '#/components/schemas/VideoChunkGeneratedMetadata'
          - type: 'null'
          title: Generated Metadata
          description: metadata of the chunk
          examples:
          - file_size: 1024
            file_type: text/plain
            language: en
            type: text
            word_count: 100
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: model used for this chunk
          examples:
          - text-embedding-ada-002
          - clip-vit-large-patch14
        type:
          type: string
          const: image_url
          title: Type
          description: Input type identifier
          default: image_url
        ocr_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Ocr Text
          description: ocr text of the image
          examples:
          - 2025 Financial Report
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: summary of the image
          examples:
          - A financial report for 2025
        image_url:
          anyOf:
          - $ref: '#/components/schemas/ImageUrl-Output'
          - type: 'null'
          description: Image URL
      type: object
      required:
      - chunk_index
      title: ImageUrlInputChunk
    StoreGrepResponse:
      properties:
        object:
          type: string
          const: list
          title: Object
          description: The object type of the response
          default: list
        data:
          items:
            oneOf:
            - $ref: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredTextInputChunk'
            - $ref: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredImageUrlInputChunk'
            - $ref: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredAudioUrlInputChunk'
            - $ref: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredVideoUrlInputChunk'
            discriminator:
              propertyName: type
              mapping:
                audio_url: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredAudioUrlInputChunk'
                image_url: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredImageUrlInputChunk'
                text: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredTextInputChunk'
                video_url: '#/components/schemas/mxbai_omni__core__store__models__chunk_types__ScoredVideoUrlInputChunk'
          type: array
          title: Data
          description: The list of chunks matching the pattern
      type: object
      required:
      - data
      title: StoreGrepResponse
    StoreFileParsingStrategy:
      type: string
      enum:
      - fast
      - high_quality
      title: StoreFileParsingStrategy
      description: Strategy for adding a file to a store.
    SearchFilter-Output:
      properties:
        all:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SearchFilter-Output'
              - $ref: '#/components/schemas/SearchFilterCondition'
            type: array
          - type: 'null'
          title: All
          description: List of conditions or filters to be ANDed together
          examples:
          - - key: price
              operator: gt
              value: '100'
            - key: color
              operator: eq
              value: red
          - null
        any:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SearchFilter-Output'
              - $ref: '#/components/schemas/SearchFilterCondition'
            type: array
          - type: 'null'
          title: Any
          description: List of conditions or filters to be ORed together
          examples:
          - - key: price
              operator: gt
              value: '100'
            - key: color
              operator: eq
              value: red
          - null
        none:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SearchFilter-Output'
              - $ref: '#/components/schemas/SearchFilterCondition'
            type: array
          - type: 'null'
          title: None
          description: List of conditions or filters to be NOTed
          examples:
          - - key: price
              operator: gt
              value: '100'
            - key: color
              operator: eq
              value: red
          - null
      type: object
      title: SearchFilter
      description: Represents a filter with AND, OR, and NOT conditions.
    StoreChunkGrepParams:
      properties:
        store_identifiers:
          items:
            anyOf:
            - type: string
            - type: string
              format: uuid
          type: array
          maxItems: 16
          minItems: 1
          title: Store Identifiers
          description: IDs or names of stores
        top_k:
          type: integer
          minimum: 1.0
          title: Top K
          description: Number of results to return
          default: 10
        filters:
          anyOf:
          - $ref: '#/components/schemas/SearchFilter-Input'
          - $ref: '#/components/schemas/SearchFilterCondition'
          - items:
              anyOf:
              - $ref: '#/components/schemas/SearchFilter-Input'
              - $ref: '#/components/schemas/SearchFilterCondition'
            type: array
          - type: 'null'
          title: Filters
          description: Optional filter conditions
        file_ids:
          anyOf:
          - prefixItems:
            - $ref: '#/components/schemas/ConditionOperator'
            - items:
                type: string
                format: uuid
              type: array
            type: array
            maxItems: 2
            minItems: 2
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: File Ids
          description: Optional list of file IDs to filter chunks by (inclusion filter)
          examples:
          - - 123e4567-e89b-12d3-a456-426614174000
            - 123e4567-e89b-12d3-a456-426614174001
          - - in
            - - 123e4567-e89b-12d3-a456-426614174000
          - - not_in
            - - 123e4567-e89b-12d3-a456-426614174000
        pattern:
          type: string
          maxLength: 1024
          minLength: 1
          title: Pattern
          description: Regular expression (RE2 syntax) matched against chunk text
          examples:
          - ERR-\d{4}
          - invoice|receipt
        targets:
          items:
            $ref: '#/components/schemas/StoreChunkGrepTarget'
          type: array
          minItems: 1
          title: Targets

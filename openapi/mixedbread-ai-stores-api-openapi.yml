  /v1/stores/search:
    post:
      tags:
      - stores
      summary: Perform semantic search across store chunks
      description: "Perform semantic search across store chunks.\n\nThis endpoint searches through store chunks using semantic similarity matching.\nIt supports complex search queries with filters and returns relevance-scored results.\n\nFor the special 'mixedbread/web' store, this endpoint performs web search using\na mixture of different providers instead of semantic search. Web search results are always\nreranked for consistent scoring.\n\nArgs:\n    search_params: Search configuration including:\n        - query text or embeddings\n        - store_identifiers: List of store identifiers to search\n        - file_ids: Optional list of file IDs to filter chunks by (or tuple of list and condition operator)\n        - metadata filters\n        - pagination parameters\n        - sorting preferences\n    _state: API state dependency\n    _ctx: Service context dependency\n\nReturns:\n    StoreSearchResponse containing:\n        - List of matched chunks with relevance scores\n        - Pagination details including total result count\n\nRaises:\n    HTTPException (400): If search parameters are invalid\n    HTTPException (404): If no vector stores are found to search"
      operationId: search_store_chunks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreChunkSearchParams'
              description: Search parameters including query text, filters and pagination options
        required: true
      responses:
        '200':
          description: List of semantically similar chunks with relevance scores and pagination details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/stores/grep:
    post:
      tags:
      - stores
      summary: Match store chunks against a regular expression
      description: "Match store chunks against a regular expression.\n\nUnlike `/stores/search`, this performs exact text matching — no embeddings, no\nsemantic similarity, no reranking. Use it to find chunks containing a specific\ntoken, identifier, error code, or literal phrase.\n\ngrep targets a single store and does not support pagination; raise `top_k` to\nretrieve more matches.\n\nArgs:\n    grep_params: Grep configuration including:\n        - pattern: RE2 regular expression matched against chunk text\n        - targets: chunk content groups to match (`text`, `generated`)\n        - case_sensitive: whether the pattern is case-sensitive\n        - store_identifiers: the single store to grep\n        - file_ids: optional list of file IDs to filter chunks by\n        - filters: optional metadata filter conditions\n        - top_k: number of matches to return\n\nReturns:\n    StoreGrepResponse containing the list of matching chunks.\n\nRaises:\n    HTTPException (400): If grep parameters are invalid\n    HTTPException (404): If the store is not found"
      operationId: grep_store_chunks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreChunkGrepParams'
              description: Grep parameters including the regular expression pattern, targets and filters
        required: true
      responses:
        '200':
          description: List of chunks whose text matches the pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreGrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/stores/list-chunks:
    post:
      tags:
      - stores
      summary: List store chunks by metadata filter and numeric ranking
      description: "List store chunks purely by metadata filters — no embeddings, no semantic similarity, no reranking.\n\nUnlike `/stores/search`, this endpoint does not require a query and never runs a vector lookup.\nIt returns chunks whose file and chunk metadata satisfy `filters`, optionally ordered by a\nnumeric metadata field via `sort_by`. Useful for ranked retrieval over numeric attributes\n(e.g. price, BPM) and for reproducing the agentic `filter_chunks` tool externally.\n\nlist-chunks targets a single store and does not support pagination; raise `top_k` to\nretrieve more chunks.\n\nArgs:\n    filter_params: Filter configuration including:\n        - store_identifiers: the single store to filter against\n        - filters: optional metadata filter conditions\n        - file_ids: optional list of file IDs to filter chunks by\n        - sort_by: optional metadata field path, or `(field, ascending)` tuple, for numeric ordering\n        - top_k: number of chunks to return\n\nReturns:\n    StoreListChunksResponse containing the list of matching chunks.\n\nRaises:\n    HTTPException (400): If filter parameters are invalid or multiple stores are passed\n    HTTPException (404): If the store is not found"
      operationId: list_store_chunks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreChunkFilterParams'
              description: Filter parameters including metadata filters, optional numeric sort, and pagination options
        required: true
      responses:
        '200':
          description: List of chunks matching the metadata filters, optionally ordered by a numeric metadata field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListChunksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/stores/question-answering:
    post:
      tags:
      - stores
      summary: Question answering
      operationId: create_question_answering
      requestBody:
        content:

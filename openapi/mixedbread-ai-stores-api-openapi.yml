openapi: 3.1.0
info:
  title: Mixedbread admin stores API
  version: 0.1.0
  description: Mixedbread admin endpoints extracted from the canonical OpenAPI spec at https://api.mixedbread.com/openapi.json
servers:
- url: https://api.mixedbread.com
  description: mixedbread ai production server
- url: https://api.dev.mixedbread.com
  description: mixedbread ai development server
- url: http://127.0.0.1:8000
  description: mixedbread local server
- url: http://localhost:8000
  description: mixedbread local server
tags:
- name: stores
paths:
  /v1/stores/{store_identifier}/events:
    get:
      tags:
      - stores
      summary: List events for a store
      description: "List events for a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    options: The pagination options.\n\nReturns:\n    StoreEventListResponse: The list of events for the store."
      operationId: list_store_events
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return per page (1-100)
          examples:
          - 10
          - 20
          - 50
          default: 20
          title: Limit
        description: Maximum number of items to return per page (1-100)
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: After
        description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: Before
        description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include total count in response (expensive operation)
          examples:
          - false
          - true
          default: false
          title: Include Total
        description: Whether to include total count in response (expensive operation)
      - name: filter_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Time to filter events before
          title: Filter Before
        description: Time to filter events before
      - name: filter_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Time to filter events after
          title: Filter After
        description: Time to filter events after
      - name: event_type
        in: query
        required: true
        schema:
          enum:
          - ingestion
          - search
          - agentic_search
          type: string
          description: The type of event to list
          examples:
          - ingestion
          - search
          - agentic_search
          title: Event Type
        description: The type of event to list
      responses:
        '200':
          description: The list of events for the store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEventListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/events/histogram:
    post:
      tags:
      - stores
      summary: Get store event histogram
      description: "Get histogram of store events over time.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    histogram_params: Parameters for histogram generation.\n\nReturns:\n    StoreEventHistogramResponse: The event histogram."
      operationId: get_store_event_histogram
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEventHistogramParams'
      responses:
        '200':
          description: Histogram of store events over time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEventHistogramResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/files:
    post:
      tags:
      - stores
      summary: Upload file to store
      description: "Upload a file to a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    file_add_params: The file to add to the store.\n\nReturns:\n    VectorStoreFile: The uploaded file details."
      operationId: create_store_file
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedStoreFileUpsertParams'
              description: The file to add to the store
      responses:
        '201':
          description: The uploaded store file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - stores
      summary: '[DEPRECATED] List store files'
      description: 'DEPRECATED: Use POST /stores/{store_identifier}/files/list instead'
      operationId: list_store_files
      deprecated: true
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return per page (1-100)
          examples:
          - 10
          - 20
          - 50
          default: 20
          title: Limit
        description: Maximum number of items to return per page (1-100)
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: After
        description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: Before
        description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include total count in response (expensive operation)
          examples:
          - false
          - true
          default: false
          title: Include Total
        description: Whether to include total count in response (expensive operation)
      - name: statuses
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StoreFileStatus'
          - type: 'null'
          description: Status to filter by
          title: Statuses
        description: Status to filter by
      responses:
        '200':
          description: The list of store files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFileListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/files/upload:
    post:
      tags:
      - stores
      summary: Upload file via form to store
      description: "Upload a file via form to a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    config: The config for the file.\n    metadata: The metadata for the file.\n    file: The file to upload.\n\nReturns:\n    VectorStoreFile: The uploaded file details."
      operationId: upload_store_file
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_store_file'
      responses:
        '201':
          description: The uploaded store file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/files/list:
    post:
      tags:
      - stores
      summary: List store files with metadata filter
      description: "List files indexed in a vector store with pagination and metadata filter.\n\nArgs:\n    vector_store_identifier: The ID or name of the vector store\n    pagination: Pagination parameters and metadata filter\n\nReturns:\n    VectorStoreFileListResponse: Paginated list of vector store files"
      operationId: list_store_files_with_metadata_filter
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCursorPagination'
              description: For pagination
      responses:
        '200':
          description: List of files in the store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFileListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/files/{file_identifier}:
    get:
      tags:
      - stores
      summary: Get store file
      description: "Get a file from a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    file_id: The ID or name of the file.\n    options: Get file options.\n\nReturns:\n    VectorStoreFile: The file details."
      operationId: retrieve_store_file
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: file_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the file
          title: File Identifier
        description: The ID or name of the file
      - name: return_chunks
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: array
            items:
              type: integer
          description: Whether to return the chunks for the file. If a list of integers is provided, only the chunks at the specified indices will be returned.
          default: false
          title: Return Chunks
        description: Whether to return the chunks for the file. If a list of integers is provided, only the chunks at the specified indices will be returned.
      responses:
        '200':
          description: The store file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - stores
      summary: Update store file metadata
      description: "Update metadata on a file within a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    file_identifier: The ID or name of the file to update.\n    update_params: Metadata update payload.\n\nReturns:\n    StoreFile: The updated file details."
      operationId: update_store_file
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: file_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the file to update
          title: File Identifier
        description: The ID or name of the file to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreFileMetadataUpdateParams'
              description: Fields to update for the store file
      responses:
        '200':
          description: The updated store file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - stores
      summary: Delete store file
      description: "Delete a file from a store.\n\nArgs:\n    store_identifier: The ID or name of the store.\n    file_id: The ID or name of the file to delete.\n\nReturns:\n    VectorStoreFileDeleted: The deleted file details."
      operationId: delete_store_file
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: file_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the file to delete
          title: File Identifier
        description: The ID or name of the file to delete
      responses:
        '200':
          description: The deleted store file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFileDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/rules:
    post:
      tags:
      - stores
      summary: Create search rule
      description: "Create a new search rule for a store.\n\nArgs:\n    store_identifier: The ID or name of the store\n    rule_create: Search rule creation parameters\n\nReturns:\n    SearchRuleResponse: The created search rule details"
      operationId: create_search_rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleCreateParams'
              description: The search rule to create
      responses:
        '201':
          description: The created search rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/rules/{rule_id}:
    get:
      tags:
      - stores
      summary: Get a search rule
      description: "Get a search rule by ID.\n\nArgs:\n    store_identifier: The ID or name of the store\n    rule_id: The ID of the search rule to retrieve\n\nReturns:\n    SearchRuleResponse: The search rule details"
      operationId: retrieve_search_rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the search rule
          title: Rule Id
        description: The ID of the search rule
      responses:
        '200':
          description: The search rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - stores
      summary: Update a search rule
      description: "Update a search rule by ID.\n\nArgs:\n    store_identifier: The ID or name of the store\n    rule_id: The ID of the search rule to update\n    rule_update: SearchRuleUpdateParams object containing the fields to update\n\nReturns:\n    SearchRuleResponse: The updated search rule details"
      operationId: update_search_rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the search rule to update
          title: Rule Id
        description: The ID of the search rule to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleUpdateParams'
              description: The fields to update
      responses:
        '200':
          description: The updated search rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - stores
      summary: Delete a search rule
      description: "Delete a search rule by ID.\n\nArgs:\n    store_identifier: The ID or name of the store\n    rule_id: The ID of the search rule to delete\n\nReturns:\n    SearchRuleDeleted: The deleted search rule details"
      operationId: delete_search_rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the search rule to delete
          title: Rule Id
        description: The ID of the search rule to delete
      responses:
        '200':
          description: The deleted search rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}/rules/{rule_id}/specific:
    delete:
      tags:
      - stores
      summary: Delete a specific rule from rules array
      description: "Delete a specific rule from within a search rule's rules array.\n\nArgs:\n    store_identifier: The ID or name of the store\n    rule_id: The ID of the search rule containing the rule to delete\n    rule_delete: The specific rule to delete from the rules array\n\nReturns:\n    SearchRuleSpecificDeleted: Details about the deletion operation"
      operationId: delete_specific_search_rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: store_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: string
            format: uuid
          description: The ID or name of the store
          title: Store Identifier
        description: The ID or name of the store
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the search rule
          title: Rule Id
        description: The ID of the search rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleSpecificDeleteParams'
              description: The specific rule to delete
      responses:
        '200':
          description: The updated search rule after deleting specific rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mxbai_omni__api__routes__v1__stores__rules__models__SearchRuleSpecificDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores:
    post:
      tags:
      - stores
      summary: Create a store
      description: "Create a new vector store.\n\nArgs:\n    vector_store_create: VectorStoreCreate object containing the name, description, and metadata.\n\nReturns:\n    VectorStore: The response containing the created vector store details."
      operationId: create_store
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateParams'
              description: The store details for creation
      responses:
        '201':
          description: The details of the created store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - stores
      summary: List stores
      description: "List all stores with optional search.\n\nArgs:\n    pagination: The pagination options.\n    q: Optional search query to filter vector stores.\n\nReturns:\n    StoreListResponse: The list of stores."
      operationId: list_stores
      security:
      - ApiKeyAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return per page (1-100)
          examples:
          - 10
          - 20
          - 50
          default: 20
          title: Limit
        description: Maximum number of items to return per page (1-100)
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: After
        description: Cursor for forward pagination - get items after this position. Use last_cursor from previous response.
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
          examples:
          - eyJjcmVhdGVkX2F0IjoiMjAyNC0xMi0zMVQyMzo1OTo1OS4wMDBaIiwiaWQiOiJhYmMxMjMifQ==
          title: Before
        description: Cursor for backward pagination - get items before this position. Use first_cursor from previous response.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include total count in response (expensive operation)
          examples:
          - false
          - true
          default: false
          title: Include Total
        description: Whether to include total count in response (expensive operation)
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          description: Search query for fuzzy matching over name and description fields
          title: Q
        description: Search query for fuzzy matching over name and description fields
      responses:
        '200':
          description: The list of stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stores/{store_identifier}:
    get:
      tags:
